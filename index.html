<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FTC Driver Simulator</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    color:white;
    font-family:sans-serif;
}
#info{
    position:absolute;
    left:10px;
    top:10px;
    background:rgba(0,0,0,.6);
    padding:10px;
}
canvas{
    display:block;
}
</style>
</head>
<body>

<div id="info">
WASD = Field-Centric Drive<br>
J/L = Turn<br>
SPACE = Toggle Intake<br>
F = Rapid Fire (3 artifacts, 0.5s spacing)<br>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const keys = {};

window.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){
        e.preventDefault();
        intakeOn = !intakeOn;
    }

    if(e.key.toLowerCase() === "f"){
        rapidFire();
    }
});

window.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

//////////////////////////////////////////////////
// Robot
//////////////////////////////////////////////////

const robot = {
    x: 500,
    y: 350,
    heading: 0,
    width: 80,
    height: 80
};

let intakeOn = false;

//////////////////////////////////////////////////
// Artifacts
//////////////////////////////////////////////////

const artifacts = [];

function spawnFieldArtifacts(){
    for(let i=0;i<20;i++){
        artifacts.push({
            x: 100 + Math.random()*1000,
            y: 100 + Math.random()*600,
            vx:0,
            vy:0,
            r:12,
            held:false
        });
    }
}

spawnFieldArtifacts();

//////////////////////////////////////////////////
// Utility
//////////////////////////////////////////////////

function rotatePoint(x,y,a){
    return {
        x:x*Math.cos(a)-y*Math.sin(a),
        y:x*Math.sin(a)+y*Math.cos(a)
    };
}

function worldToRobot(wx,wy){
    const dx = wx-robot.x;
    const dy = wy-robot.y;

    const c = Math.cos(-robot.heading);
    const s = Math.sin(-robot.heading);

    return {
        x: dx*c - dy*s,
        y: dx*s + dy*c
    };
}

function pointInsideRobot(wx,wy){

    const p = worldToRobot(wx,wy);

    return (
        p.x > -robot.width/2 &&
        p.x < robot.width/2 &&
        p.y > -robot.height/2 &&
        p.y < robot.height/2
    );
}

//////////////////////////////////////////////////
// Rapid Fire
//////////////////////////////////////////////////

let inventory = 0;

function rapidFire(){

    if(inventory <= 0) return;

    let shots = Math.min(3, inventory);

    for(let i=0;i<shots;i++){

        setTimeout(()=>{

            if(inventory<=0) return;

            inventory--;

            const muzzle = rotatePoint(
                robot.width/2 + 20,
                0,
                robot.heading
            );

            artifacts.push({
                x: robot.x + muzzle.x,
                y: robot.y + muzzle.y,
                vx: Math.cos(robot.heading)*500,
                vy: Math.sin(robot.heading)*500,
                r:12,
                held:false
            });

        }, i*500);
    }
}

//////////////////////////////////////////////////
// Update
//////////////////////////////////////////////////

let last = performance.now();

function update(dt){

    //////////////////////////////////////////////////
    // FIELD-CENTRIC TRANSLATION
    //////////////////////////////////////////////////

    let fieldX = 0;
    let fieldY = 0;

    if(keys["w"]) fieldY -= 1;
    if(keys["s"]) fieldY += 1;
    if(keys["a"]) fieldX -= 1;
    if(keys["d"]) fieldX += 1;

    let len = Math.hypot(fieldX,fieldY);
    if(len>0){
        fieldX/=len;
        fieldY/=len;
    }

    const driveSpeed = 250;

    robot.x += fieldX*driveSpeed*dt;
    robot.y += fieldY*driveSpeed*dt;

    //////////////////////////////////////////////////
    // TURNING
    //////////////////////////////////////////////////

    const turnSpeed = 2.5;

    if(keys["j"]) robot.heading -= turnSpeed*dt;
    if(keys["l"]) robot.heading += turnSpeed*dt;

    //////////////////////////////////////////////////
    // ARTIFACT PHYSICS
    //////////////////////////////////////////////////

    for(const a of artifacts){

        a.x += a.vx*dt;
        a.y += a.vy*dt;

        a.vx *= 0.99;
        a.vy *= 0.99;

        //////////////////////////////////////////////////
        // ROBOT COLLISION
        //////////////////////////////////////////////////

        const p = worldToRobot(a.x,a.y);

        const hw = robot.width/2;
        const hh = robot.height/2;

        const overlapX = hw + a.r - Math.abs(p.x);
        const overlapY = hh + a.r - Math.abs(p.y);

        if(overlapX > 0 && overlapY > 0){

            if(overlapX < overlapY){

                p.x += Math.sign(p.x)*overlapX;

            }else{

                p.y += Math.sign(p.y)*overlapY;
            }

            const corrected = rotatePoint(
                p.x,
                p.y,
                robot.heading
            );

            a.x = robot.x + corrected.x;
            a.y = robot.y + corrected.y;
        }
    }

    //////////////////////////////////////////////////
    // INTAKE
    //////////////////////////////////////////////////

    if(intakeOn){

        const intakeOffset = rotatePoint(
            robot.width/2 + 10,
            0,
            robot.heading
        );

        const intakeX = robot.x + intakeOffset.x;
        const intakeY = robot.y + intakeOffset.y;

        for(let i=artifacts.length-1;i>=0;i--){

            const a = artifacts[i];

            const d = Math.hypot(
                a.x-intakeX,
                a.y-intakeY
            );

            // Must physically touch intake
            if(d < 18){

                // Ensure artifact is actually
                // in front of robot, not through it

                const local = worldToRobot(a.x,a.y);

                if(local.x > robot.width/2 - 5){

                    artifacts.splice(i,1);
                    inventory++;
                }
            }
        }
    }
}

//////////////////////////////////////////////////
// Draw
//////////////////////////////////////////////////

function drawField(){

    ctx.strokeStyle = "#333";

    for(let x=0;x<2000;x+=50){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,2000);
        ctx.stroke();
    }

    for(let y=0;y<2000;y+=50){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(2000,y);
        ctx.stroke();
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();

    ctx.translate(
        canvas.width/2 - robot.x,
        canvas.height/2 - robot.y
    );

    drawField();

    //////////////////////////////////////////////////
    // Intake
    //////////////////////////////////////////////////

    const intakePos = rotatePoint(
        robot.width/2 + 10,
        0,
        robot.heading
    );

    ctx.fillStyle = intakeOn ? "lime" : "red";

    ctx.beginPath();
    ctx.arc(
        robot.x + intakePos.x,
        robot.y + intakePos.y,
        10,
        0,
        Math.PI*2
    );
    ctx.fill();

    //////////////////////////////////////////////////
    // Artifacts
    //////////////////////////////////////////////////

    for(const a of artifacts){

        ctx.fillStyle = "orange";

        ctx.beginPath();
        ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
        ctx.fill();
    }

    //////////////////////////////////////////////////
    // Robot
    //////////////////////////////////////////////////

    ctx.save();

    ctx.translate(robot.x,robot.y);
    ctx.rotate(robot.heading);

    ctx.fillStyle = "#3fa9f5";
    ctx.fillRect(
        -robot.width/2,
        -robot.height/2,
        robot.width,
        robot.height
    );

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(robot.width/2,0);
    ctx.stroke();

    ctx.restore();

    ctx.restore();

    ctx.fillStyle = "white";
    ctx.fillText("Inventory: "+inventory,10,120);
    ctx.fillText("Intake: "+(intakeOn?"ON":"OFF"),10,140);
}

//////////////////////////////////////////////////
// Main Loop
//////////////////////////////////////////////////

function loop(now){

    const dt = Math.min(
        (now-last)/1000,
        0.03
    );

    last = now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
