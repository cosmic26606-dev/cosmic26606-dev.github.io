<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DECODE Simulator V1</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    left:10px;
    top:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:8px;
}
</style>
</head>

<body>

<div id="hud">
WASD = Drive<br>
J/L = Turn<br>
SPACE = Intake Toggle<br>
F = Fire Burst
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

//////////////////////////////////////////////////
// FIELD
//////////////////////////////////////////////////

const TILE = 120;

const FIELD_W = TILE * 6;
const FIELD_H = TILE * 6;

//////////////////////////////////////////////////
// INPUT
//////////////////////////////////////////////////

const keys = {};

window.addEventListener("keydown", e=>{

    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){
        e.preventDefault();
    }

});

window.addEventListener("keyup", e=>{

    keys[e.key.toLowerCase()] = false;

});

//////////////////////////////////////////////////
// ROBOT
//////////////////////////////////////////////////

const robot = {

    x: FIELD_W/2,
    y: FIELD_H/2,

    heading: 0,

    width: 90,
    height: 90,

    intakeOn: false,

    inventory: 0,

    blueScore: 0,
    redScore: 0

};

//////////////////////////////////////////////////
// GOALS
//////////////////////////////////////////////////

const goals = [

{
    color:"blue",
    x:FIELD_W-140,
    y:120,
    w:90,
    h:90
},

{
    color:"red",
    x:FIELD_W-140,
    y:FIELD_H-210,
    w:90,
    h:90
}

];

//////////////////////////////////////////////////
// ARTIFACTS
//////////////////////////////////////////////////

const artifacts = [];

function spawnArtifact(x,y){

    artifacts.push({

        x:x,
        y:y,

        vx:0,
        vy:0,

        radius:12,

        collected:false,
        fired:false

    });

}

//////////////////////////////////////////////////
// DECODE-LIKE STACKS
//////////////////////////////////////////////////

for(let i=0;i<4;i++){

    spawnArtifact(
        180 + i*30,
        180
    );

    spawnArtifact(
        180 + i*30,
        FIELD_H-180
    );

}

for(let i=0;i<5;i++){

    spawnArtifact(
        FIELD_W/2 + i*25,
        FIELD_H/2 - 100
    );

    spawnArtifact(
        FIELD_W/2 + i*25,
        FIELD_H/2 + 100
    );

}

//////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////

const camera = {

    x:0,
    y:0

};

//////////////////////////////////////////////////
// DRAW FIELD
//////////////////////////////////////////////////

function drawField(){

    for(let x=0;x<6;x++){

        for(let y=0;y<6;y++){

            ctx.fillStyle =
                (x+y)%2
                ? "#2f2f2f"
                : "#3a3a3a";

            ctx.fillRect(
                x*TILE,
                y*TILE,
                TILE,
                TILE
            );

            ctx.strokeStyle="#111";

            ctx.strokeRect(
                x*TILE,
                y*TILE,
                TILE,
                TILE
            );

        }

    }

    //////////////////////////////////////////////////
    // DECODE DIAGONALS
    //////////////////////////////////////////////////

    ctx.strokeStyle="white";
    ctx.lineWidth=6;

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(360,360);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,FIELD_H);
    ctx.lineTo(360,360);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(FIELD_W,240);
    ctx.lineTo(FIELD_W-120,360);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(FIELD_W,480);
    ctx.lineTo(FIELD_W-120,360);
    ctx.stroke();

    //////////////////////////////////////////////////
    // BLUE GOAL
    //////////////////////////////////////////////////

    ctx.fillStyle="#2255ff";

    ctx.fillRect(
        goals[0].x,
        goals[0].y,
        goals[0].w,
        goals[0].h
    );

    //////////////////////////////////////////////////
    // RED GOAL
    //////////////////////////////////////////////////

    ctx.fillStyle="#ff3333";

    ctx.fillRect(
        goals[1].x,
        goals[1].y,
        goals[1].w,
        goals[1].h
    );

}

//////////////////////////////////////////////////
// DRAW ROBOT
//////////////////////////////////////////////////

function drawRobot(){

    ctx.save();

    ctx.translate(
        robot.x,
        robot.y
    );

    ctx.rotate(
        robot.heading
    );

    ctx.fillStyle="#00c8ff";

    ctx.fillRect(
        -robot.width/2,
        -robot.height/2,
        robot.width,
        robot.height
    );

    //////////////////////////////////////////////////
    // FRONT
    //////////////////////////////////////////////////

    ctx.strokeStyle="white";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(0,0);
    ctx.lineTo(
        robot.width/2,
        0
    );

    ctx.stroke();

    //////////////////////////////////////////////////
    // INTAKE / SHOOTER SIDE
    //////////////////////////////////////////////////

    ctx.fillStyle =
        robot.intakeOn
        ? "lime"
        : "red";

    ctx.fillRect(
        robot.width/2-8,
        -20,
        16,
        40
    );

    ctx.restore();

}

//////////////////////////////////////////////////
// DRAW ARTIFACTS
//////////////////////////////////////////////////

function drawArtifacts(){

    for(const a of artifacts){

        ctx.fillStyle="orange";

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            a.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

}
//////////////////////////////////////////////////
// HELPERS
//////////////////////////////////////////////////

function rotatePoint(x,y,a){

    return {

        x:x*Math.cos(a)-y*Math.sin(a),
        y:x*Math.sin(a)+y*Math.cos(a)

    };

}

function worldToRobot(wx,wy){

    const dx = wx - robot.x;
    const dy = wy - robot.y;

    const c = Math.cos(-robot.heading);
    const s = Math.sin(-robot.heading);

    return {

        x:dx*c - dy*s,
        y:dx*s + dy*c

    };

}

//////////////////////////////////////////////////
// INTAKE TOGGLE
//////////////////////////////////////////////////

window.addEventListener("keydown",e=>{

    if(e.code==="Space"){

        robot.intakeOn =
            !robot.intakeOn;

    }

});

//////////////////////////////////////////////////
// BURST FIRE
//////////////////////////////////////////////////

let burstBusy = false;

function fireOne(){

    if(robot.inventory <= 0)
        return;

    robot.inventory--;

    const muzzle =
        rotatePoint(
            robot.width/2 + 30,
            0,
            robot.heading
        );

    artifacts.push({

        x:robot.x + muzzle.x,
        y:robot.y + muzzle.y,

        vx:Math.cos(robot.heading)*700,
        vy:Math.sin(robot.heading)*700,

        radius:10,

        fired:true

    });

}

function burstFire(){

    if(burstBusy)
        return;

    if(robot.inventory <= 0)
        return;

    burstBusy = true;

    const shots =
        Math.min(
            3,
            robot.inventory
        );

    for(let i=0;i<shots;i++){

        setTimeout(()=>{

            fireOne();

        },i*167);

    }

    setTimeout(()=>{

        burstBusy=false;

    },500);

}

window.addEventListener("keydown",e=>{

    if(e.key.toLowerCase()==="f"){

        burstFire();

    }

});

//////////////////////////////////////////////////
// UPDATE ROBOT
//////////////////////////////////////////////////

function updateRobot(dt){

    let mx=0;
    let my=0;

    if(keys["w"]) my-=1;
    if(keys["s"]) my+=1;
    if(keys["a"]) mx-=1;
    if(keys["d"]) mx+=1;

    const mag =
        Math.hypot(mx,my);

    if(mag>0){

        mx/=mag;
        my/=mag;

    }

    const speed = 280;

    robot.x += mx*speed*dt;
    robot.y += my*speed*dt;

    if(keys["j"])
        robot.heading -= 2.8*dt;

    if(keys["l"])
        robot.heading += 2.8*dt;

    robot.x =
        Math.max(
            robot.width/2,
            Math.min(
                FIELD_W-robot.width/2,
                robot.x
            )
        );

    robot.y =
        Math.max(
            robot.height/2,
            Math.min(
                FIELD_H-robot.height/2,
                robot.y
            )
        );

}

//////////////////////////////////////////////////
// UPDATE ARTIFACTS
//////////////////////////////////////////////////

function updateArtifacts(dt){

    for(let i=artifacts.length-1;i>=0;i--){

        const a = artifacts[i];

        a.x += a.vx*dt;
        a.y += a.vy*dt;

        a.vx *= 0.99;
        a.vy *= 0.99;

        //////////////////////////////////////////////////
        // GOAL SCORING
        //////////////////////////////////////////////////

        if(a.fired){

            for(const goal of goals){

                if(
                    a.x > goal.x &&
                    a.x < goal.x+goal.w &&
                    a.y > goal.y &&
                    a.y < goal.y+goal.h
                ){

                    if(goal.color==="blue")
                        robot.blueScore++;

                    if(goal.color==="red")
                        robot.redScore++;

                    artifacts.splice(i,1);

                    continue;
                }

            }

        }

        //////////////////////////////////////////////////
        // ROBOT COLLISION
        //////////////////////////////////////////////////

        const local =
            worldToRobot(
                a.x,
                a.y
            );

        const hw =
            robot.width/2 +
            a.radius;

        const hh =
            robot.height/2 +
            a.radius;

        if(
            Math.abs(local.x)<hw &&
            Math.abs(local.y)<hh
        ){

            const ox =
                hw -
                Math.abs(local.x);

            const oy =
                hh -
                Math.abs(local.y);

            if(ox<oy){

                local.x +=
                    Math.sign(local.x)
                    * ox;

            }
            else{

                local.y +=
                    Math.sign(local.y)
                    * oy;

            }

            const world =
                rotatePoint(
                    local.x,
                    local.y,
                    robot.heading
                );

            a.x =
                robot.x +
                world.x;

            a.y =
                robot.y +
                world.y;

        }

    }

}

//////////////////////////////////////////////////
// INTAKE SYSTEM
//////////////////////////////////////////////////

function updateIntake(){

    if(!robot.intakeOn)
        return;

    if(robot.inventory>=3)
        return;

    const intake =
        rotatePoint(
            robot.width/2 + 10,
            0,
            robot.heading
        );

    const ix =
        robot.x + intake.x;

    const iy =
        robot.y + intake.y;

    for(let i=artifacts.length-1;i>=0;i--){

        const a = artifacts[i];

        if(a.fired)
            continue;

        const d =
            Math.hypot(
                a.x-ix,
                a.y-iy
            );

        if(d<18){

            const local =
                worldToRobot(
                    a.x,
                    a.y
                );

            if(
                local.x >
                robot.width/2 - 6
            ){

                artifacts.splice(i,1);

                robot.inventory++;

                if(robot.inventory>=3)
                    break;

            }

        }

    }

}

//////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////

function updateCamera(){

    camera.x =
        robot.x -
        canvas.width/2;

    camera.y =
        robot.y -
        canvas.height/2;

}

//////////////////////////////////////////////////
// DRAW HUD
//////////////////////////////////////////////////

function drawHUD(){

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.fillStyle="white";
    ctx.font="18px Arial";

    ctx.fillText(
        "Inventory: "
        + robot.inventory,
        20,
        120
    );

    ctx.fillText(
        "Blue Score: "
        + robot.blueScore,
        20,
        145
    );

    ctx.fillText(
        "Red Score: "
        + robot.redScore,
        20,
        170
    );

    ctx.fillText(
        "Intake: "
        + (robot.intakeOn
            ? "ON"
            : "OFF"),
        20,
        195
    );

}

//////////////////////////////////////////////////
// MAIN LOOP
//////////////////////////////////////////////////

let last =
    performance.now();

function loop(now){

    const dt =
        Math.min(
            (now-last)/1000,
            0.03
        );

    last = now;

    updateRobot(dt);
    updateArtifacts(dt);
    updateIntake();
    updateCamera();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    drawField();
    drawArtifacts();
    drawRobot();

    ctx.restore();

    drawHUD();

    requestAnimationFrame(
        loop
    );

}

requestAnimationFrame(
    loop
);

</script>
</body>
</html>
