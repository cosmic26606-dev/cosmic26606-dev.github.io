<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DECODE Simulator V2</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    background:rgba(0,0,0,.6);
    padding:10px;
}
</style>
</head>

<body>

<div id="hud">
DECODE V2<br>
WASD Drive<br>
J/L Turn<br>
Space Intake<br>
F Burst Fire
</div>

<canvas id="game"></canvas>

<script>

//////////////////////////////////////////////////
// CANVAS
//////////////////////////////////////////////////

const canvas =
    document.getElementById(
        "game"
    );

const ctx =
    canvas.getContext("2d");

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);

//////////////////////////////////////////////////
// FIELD
//////////////////////////////////////////////////

const TILE = 120;

const FIELD = {

    width: TILE * 6,
    height: TILE * 6

};

//////////////////////////////////////////////////
// INPUT
//////////////////////////////////////////////////

const keys = {};

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = true;

        if(
            e.code==="Space"
        ){

            e.preventDefault();

        }

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);

//////////////////////////////////////////////////
// ROBOT
//////////////////////////////////////////////////

const robot = {

    x:
        FIELD.width/2,

    y:
        FIELD.height/2,

    heading:0,

    width:84,
    height:84,

    intakeOn:false,

    inventory:0,

    maxInventory:3,

    blueScore:0,

    redScore:0

};

//////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////

const camera = {

    x:0,
    y:0

};

//////////////////////////////////////////////////
// GOALS
//////////////////////////////////////////////////

const goals = [

{

    alliance:"blue",

    x:
        FIELD.width-190,

    y:150,

    width:110,

    height:180

},

{

    alliance:"red",

    x:
        FIELD.width-190,

    y:
        FIELD.height-330,

    width:110,

    height:180

}

];

//////////////////////////////////////////////////
// ARTIFACTS
//////////////////////////////////////////////////

const artifacts = [];

function Artifact(
    x,
    y,
    color
){

    return {

        x,
        y,

        vx:0,
        vy:0,

        radius:11,

        color,

        scored:false,

        fired:false

    };

}

//////////////////////////////////////////////////
// 36 TOTAL
//////////////////////////////////////////////////

function generateArtifacts(){

    artifacts.length = 0;

    //////////////////////////////////////////////////
    // LEFT CLUSTER
    //////////////////////////////////////////////////

    for(
        let i=0;
        i<12;
        i++
    ){

        artifacts.push(

            Artifact(

                120 +
                (i%4)*28,

                120 +
                Math.floor(i/4)
                *28,

                "purple"

            )

        );

    }

    //////////////////////////////////////////////////
    // CENTER CLUSTER
    //////////////////////////////////////////////////

    for(
        let i=0;
        i<12;
        i++
    ){

        artifacts.push(

            Artifact(

                FIELD.width/2
                -50
                +(i%4)*28,

                FIELD.height/2
                -50
                +Math.floor(i/4)
                *28,

                "purple"

            )

        );

    }

    //////////////////////////////////////////////////
    // RIGHT CLUSTER
    //////////////////////////////////////////////////

    for(
        let i=0;
        i<12;
        i++
    ){

        artifacts.push(

            Artifact(

                FIELD.width
                -260
                +(i%4)*28,

                FIELD.height/2
                -50
                +Math.floor(i/4)
                *28,

                "green"

            )

        );

    }

}

generateArtifacts();

//////////////////////////////////////////////////
// UTILITIES
//////////////////////////////////////////////////

function rotatePoint(
    x,
    y,
    angle
){

    return {

        x:
            x*Math.cos(angle)
            -
            y*Math.sin(angle),

        y:
            x*Math.sin(angle)
            +
            y*Math.cos(angle)

    };

}

function worldToRobot(
    wx,
    wy
){

    const dx =
        wx-robot.x;

    const dy =
        wy-robot.y;

    const c =
        Math.cos(
            -robot.heading
        );

    const s =
        Math.sin(
            -robot.heading
        );

    return {

        x:
            dx*c
            -
            dy*s,

        y:
            dx*s
            +
            dy*c

    };

}

//////////////////////////////////////////////////
// DRAW FIELD
//////////////////////////////////////////////////

function drawField(){

    //////////////////////////////////////////////////
    // TILES
    //////////////////////////////////////////////////

    for(
        let x=0;
        x<6;
        x++
    ){

        for(
            let y=0;
            y<6;
            y++
        ){

            ctx.fillStyle =
                (
                    x+y
                )%2
                ?
                "#353535"
                :
                "#404040";

            ctx.fillRect(

                x*TILE,
                y*TILE,

                TILE,
                TILE

            );

            ctx.strokeStyle =
                "#222";

            ctx.strokeRect(

                x*TILE,
                y*TILE,

                TILE,
                TILE

            );

        }

    }

    //////////////////////////////////////////////////
    // CROSSING TAPES
    //////////////////////////////////////////////////

    ctx.strokeStyle =
        "white";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.lineTo(
        360,
        360
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        0,
        FIELD.height
    );

    ctx.lineTo(
        360,
        360
    );

    ctx.stroke();

    //////////////////////////////////////////////////
    // BLUE LOADING AREA
    //////////////////////////////////////////////////

    ctx.fillStyle =
        "#2244ff";

    ctx.fillRect(
        0,
        0,
        110,
        110
    );

    //////////////////////////////////////////////////
    // RED LOADING AREA
    //////////////////////////////////////////////////

    ctx.fillStyle =
        "#ff3333";

    ctx.fillRect(
        0,
        FIELD.height-110,
        110,
        110
    );

    //////////////////////////////////////////////////
    // GOALS
    //////////////////////////////////////////////////

    for(
        const goal
        of goals
    ){

        ctx.fillStyle =
            goal.alliance
            ==="blue"
            ?
            "#2244ff"
            :
            "#ff3333";

        ctx.fillRect(

            goal.x,
            goal.y,

            goal.width,
            goal.height

        );

    }

    //////////////////////////////////////////////////
// INPUT HANDLING (TOGGLE INTAKE + FIRE)
//////////////////////////////////////////////////

window.addEventListener("keydown", e=>{

    const k = e.key.toLowerCase();

    if(k==="f") burstFire();

    if(e.code==="Space"){

        robot.intakeOn =
            !robot.intakeOn;

    }

});

//////////////////////////////////////////////////
// BURST FIRE
//////////////////////////////////////////////////

let burstLock = false;

function fireArtifact(){

    if(robot.inventory<=0)
        return;

    robot.inventory--;

    const muzzle =
        rotatePoint(
            robot.width/2 + 25,
            0,
            robot.heading
        );

    artifacts.push({

        x:robot.x + muzzle.x,
        y:robot.y + muzzle.y,

        vx:
            Math.cos(robot.heading)
            * 650,

        vy:
            Math.sin(robot.heading)
            * 650,

        radius:10,

        fired:true,

        color:"orange",

        scored:false

    });

}

function burstFire(){

    if(burstLock)
        return;

    if(robot.inventory<=0)
        return;

    burstLock = true;

    const shots =
        Math.min(
            3,
            robot.inventory
        );

    for(
        let i=0;
        i<shots;
        i++
    ){

        setTimeout(()=>{

            fireArtifact();

        }, i*167);

    }

    setTimeout(()=>{

        burstLock = false;

    },500);

}

//////////////////////////////////////////////////
// ROBOT UPDATE (FIELD-CENTRIC)
//////////////////////////////////////////////////

function updateRobot(dt){

    let x = 0;
    let y = 0;

    if(keys["w"]) y -= 1;
    if(keys["s"]) y += 1;
    if(keys["a"]) x -= 1;
    if(keys["d"]) x += 1;

    const mag =
        Math.hypot(x,y);

    if(mag>0){

        x/=mag;
        y/=mag;

    }

    const speed = 280;

    robot.x += x*speed*dt;
    robot.y += y*speed*dt;

    if(keys["j"])
        robot.heading -= 2.7*dt;

    if(keys["l"])
        robot.heading += 2.7*dt;

}

//////////////////////////////////////////////////
// ARTIFACT UPDATE + COLLISION + SCORING
//////////////////////////////////////////////////

function updateArtifacts(dt){

    for(
        let i=artifacts.length-1;
        i>=0;
        i--
    ){

        const a = artifacts[i];

        a.x += a.vx*dt;
        a.y += a.vy*dt;

        a.vx *= 0.99;
        a.vy *= 0.99;

        //////////////////////////////////////////////////
        // ROBOT COLLISION (NO PHASING)
        //////////////////////////////////////////////////

        const local =
            worldToRobot(
                a.x,
                a.y
            );

        const hw =
            robot.width/2 +
            a.radius;

        const hh =
            robot.height/2 +
            a.radius;

        if(
            Math.abs(local.x)<hw &&
            Math.abs(local.y)<hh
        ){

            const ox =
                hw -
                Math.abs(local.x);

            const oy =
                hh -
                Math.abs(local.y);

            if(ox<oy){

                local.x +=
                    Math.sign(local.x)
                    * ox;

            }else{

                local.y +=
                    Math.sign(local.y)
                    * oy;

            }

            const world =
                rotatePoint(
                    local.x,
                    local.y,
                    robot.heading
                );

            a.x = robot.x + world.x;
            a.y = robot.y + world.y;

        }

        //////////////////////////////////////////////////
        // SCORING + EJECTION (DO NOT DELETE ARTIFACT)
        //////////////////////////////////////////////////

        if(a.fired && !a.scored){

            for(const g of goals){

                if(
                    a.x > g.x &&
                    a.x < g.x + g.width &&
                    a.y > g.y &&
                    a.y < g.y + g.height
                ){

                    a.scored = true;

                    if(g.alliance==="blue")
                        robot.blueScore++;

                    if(g.alliance==="red")
                        robot.redScore++;

                    // eject artifact out of goal
                    a.vx = 200;
                    a.vy = (Math.random()-0.5)*120;

                    a.x = g.x + g.width + 20;

                    break;

                }

            }

        }

    }

}

//////////////////////////////////////////////////
// INTAKE SYSTEM (MAX 3)
//////////////////////////////////////////////////

function updateIntake(){

    if(!robot.intakeOn)
        return;

    if(robot.inventory>=3)
        return;

    const intake =
        rotatePoint(
            robot.width/2 + 10,
            0,
            robot.heading
        );

    const ix =
        robot.x + intake.x;

    const iy =
        robot.y + intake.y;

    for(
        let i=artifacts.length-1;
        i>=0;
        i--
    ){

        const a = artifacts[i];

        if(a.fired)
            continue;

        const d =
            Math.hypot(
                a.x-ix,
                a.y-iy
            );

        if(d<18){

            const local =
                worldToRobot(
                    a.x,
                    a.y
                );

            if(local.x > robot.width/2 - 5){

                artifacts.splice(i,1);

                robot.inventory++;

                if(robot.inventory>=3)
                    break;

            }

        }

    }

}

//////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////

function updateCamera(){

    camera.x =
        robot.x -
        canvas.width/2;

    camera.y =
        robot.y -
        canvas.height/2;

}

//////////////////////////////////////////////////
// DRAW ROBOT
//////////////////////////////////////////////////

function drawRobot(){

    ctx.save();

    ctx.translate(
        robot.x,
        robot.y
    );

    ctx.rotate(robot.heading);

    ctx.fillStyle="#00c8ff";

    ctx.fillRect(
        -robot.width/2,
        -robot.height/2,
        robot.width,
        robot.height
    );

    // intake indicator
    ctx.fillStyle =
        robot.intakeOn
        ? "lime"
        : "red";

    ctx.fillRect(
        robot.width/2 - 10,
        -18,
        14,
        36
    );

    ctx.restore();

}

//////////////////////////////////////////////////
// DRAW ARTIFACTS
//////////////////////////////////////////////////

function drawArtifacts(){

    for(const a of artifacts){

        ctx.fillStyle =
            a.color==="green"
            ? "#00cc55"
            : "#aa55ff";

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            a.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}

//////////////////////////////////////////////////
// HUD
//////////////////////////////////////////////////

function drawHUD(){

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.fillStyle="white";

    ctx.font="16px Arial";

    ctx.fillText(
        "Inventory: "
        + robot.inventory,
        20,
        40
    );

    ctx.fillText(
        "Blue Score: "
        + robot.blueScore,
        20,
        65
    );

    ctx.fillText(
        "Red Score: "
        + robot.redScore,
        20,
        90
    );

}

//////////////////////////////////////////////////
// MAIN LOOP
//////////////////////////////////////////////////

let last =
    performance.now();

function loop(now){

    const dt =
        Math.min(
            (now-last)/1000,
            0.03
        );

    last = now;

    updateRobot(dt);
    updateArtifacts(dt);
    updateIntake();
    updateCamera();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    drawField();
    drawArtifacts();
    drawRobot();

    ctx.restore();

    drawHUD();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);
    
}
